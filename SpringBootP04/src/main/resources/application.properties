# Make sure the database name at the end matches the one you created!
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate create the tables automatically from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true